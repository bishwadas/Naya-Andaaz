version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: sereia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sereia_db}
      POSTGRES_USER: ${DB_USER:-sereia_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sereia_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sereia_user} -d ${DB_NAME:-sereia_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for caching & Celery broker
  redis:
    image: redis:7-alpine
    container_name: sereia_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Django Backend API & Admin
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sereia_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py makemigrations --noinput &&
             python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-sereia_user}:${DB_PASSWORD:-sereia_password}@db:5432/${DB_NAME:-sereia_db}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-sereia-key}
      DJANGO_ENV: production
      DEBUG: "False"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://frontend:3000
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sereia_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  static_volume:
  media_volume:
